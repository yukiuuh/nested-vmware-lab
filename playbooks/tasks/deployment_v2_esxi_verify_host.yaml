---
- name: Derive ESXi guest verification capability
  ansible.builtin.set_fact:
    deployment_v2_esxi_guest_verification: >-
      {{
        deployment_v2_esxi_host.capabilities.guest_verification
        | default(
            deployment_v2_esxi_group_config.capabilities.guest_verification
            | default(
                'vmware_tools'
                if (deployment_v2_esxi_group_config.placement.kind | default('')) == 'provider_vsphere'
                else 'ssh'
              )
          )
      }}

- name: Validate ESXi guest verification capability
  ansible.builtin.assert:
    that:
      - deployment_v2_esxi_guest_verification in ["vmware_tools", "ssh", "https"]
    fail_msg: >-
      Unsupported guest_verification={{ deployment_v2_esxi_guest_verification }}
      for {{ deployment_v2_esxi_host.fqdn }}. Supported values are vmware_tools,
      ssh, and https.

- name: Wait for ESXi HTTPS API to become reachable
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname].ansible_host }}"
    port: 443
    timeout: 1800
    connect_timeout: 5
    sleep: 5
    state: started
  delegate_to: "{{ deployment_v2_verification_router }}"

- name: Wait for ESXi SSH to become reachable
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname].ansible_host }}"
    port: 22
    timeout: 1800
    connect_timeout: 5
    sleep: 5
    state: started
  delegate_to: "{{ deployment_v2_verification_router }}"
  when: deployment_v2_esxi_guest_verification == "ssh"

- name: Validate vSphere credentials are available for VMware Tools verification
  ansible.builtin.assert:
    that:
      - deployment_v2.credentials is defined
      - deployment_v2.credentials.vsphere is defined
      - deployment_v2.credentials.vsphere.server is defined
      - deployment_v2.credentials.vsphere.user is defined
      - deployment_v2.credentials.vsphere.password is defined
      - deployment_v2.credentials.vsphere.datacenter is defined
      - deployment_v2.credentials.vm_admin_password is defined
    fail_msg: >-
      deployment_v2.credentials.vsphere and deployment_v2.credentials.vm_admin_password
      must be present when guest_verification=vmware_tools.
  when: deployment_v2_esxi_guest_verification == "vmware_tools"

- name: Wait for VMware Tools on ESXi guest
  community.vmware.vmware_guest_tools_wait:
    hostname: "{{ deployment_v2.credentials.vsphere.server }}"
    username: "{{ deployment_v2.credentials.vsphere.user }}"
    password: "{{ deployment_v2.credentials.vsphere.password }}"
    validate_certs: false
    datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
    name: "{{ deployment_v2_esxi_host.name }}"
  register: deployment_v2_esxi_guest_tools
  until: deployment_v2_esxi_guest_tools is succeeded
  retries: 90
  delay: 20
  delegate_to: localhost
  when: deployment_v2_esxi_guest_verification == "vmware_tools"

- name: Wait for ESXi provisioning marker via VMware Tools guest operations
  community.vmware.vmware_vm_shell:
    hostname: "{{ deployment_v2.credentials.vsphere.server }}"
    username: "{{ deployment_v2.credentials.vsphere.user }}"
    password: "{{ deployment_v2.credentials.vsphere.password }}"
    validate_certs: false
    datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
    vm_id: "{{ deployment_v2_esxi_host.name }}"
    vm_username: root
    vm_password: "{{ deployment_v2.credentials.vm_admin_password }}"
    vm_shell: /bin/sh
    vm_shell_args: "-c 'test -f /var/tmp/provisioned'"
    wait_for_process: true
  register: deployment_v2_esxi_provisioned_marker
  changed_when: false
  retries: 30
  delay: 20
  until: (deployment_v2_esxi_provisioned_marker.exit_code | default(1)) == 0
  failed_when: false
  delegate_to: localhost
  when: deployment_v2_esxi_guest_verification == "vmware_tools"
