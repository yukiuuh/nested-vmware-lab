---
# This task is called in a loop for nodes needing deployment
- name: "Deploy NSX Edge VM {{ node_info.item.vmname }} (Async Trigger)"
  vmware.ansible_for_nsxt.nsxt_transport_nodes:
    hostname: "{{ nsx_hostname }}"
    username: admin
    password: "{{ nsx_password }}"
    validate_certs: "{{ validate_certs }}"
    display_name: "{{ node_info.item.vmname }}"
    host_switch_spec:
      resource_type: StandardHostSwitchSpec
      host_switches:
        - host_switch_name: nvds
          host_switch_type: NVDS
          host_switch_mode: STANDARD
          host_switch_profiles:
            - name: "{{ edge_tep_uplink_profile_name }}"
              type: UplinkHostSwitchProfile
          pnics:
            - device_name: fp-eth0
              uplink_name: uplink-1
          ip_assignment_spec:
            resource_type: StaticIpPoolSpec
            ip_pool_name: "{{ edge_tep_ip_pool_name }}"
          transport_zone_endpoints:
            - transport_zone_name: nsx-vlan-transportzone
            - transport_zone_name: nsx-overlay-transportzone
    node_deployment_info:
      deployment_type: VIRTUAL_MACHINE
      deployment_config:
        form_factor: "{{ edge_deployment_size }}"
        vm_deployment_config:
          vc_name: "{{ vc_address }}"
          vc_username: "{{ vc_username }}"
          vc_password: "{{ vc_password }}"
          storage: "{{ datastore_name }}"
          compute: "{{ cluster_name }}"
          data_networks:
            - "{{ edge_uplink_segment_name }}"
          default_gateway_addresses:
            - "{{ gateway }}"
          management_network: "{{ management_portgroup_name }}"
          management_port_subnets:
            - ip_addresses:
                - "{{ node_info.item.management_ip }}"
              prefix_length: 24
          reservation_info:
            cpu_reservation:
              reservation_in_mhz: 0
            memory_reservation:
              reservation_percentage: 0
          placement_type: VsphereDeploymentConfig
        node_user_settings:
          cli_username: admin
          root_password: "{{ nsx_password }}"
          cli_password: "{{ nsx_password }}"
          audit_username: audit
          audit_password: "{{ nsx_password }}"
      node_settings:
        allow_ssh_root_login: "True"
        enable_ssh: "True"
        hostname: "{{ node_info.item.hostname }}.{{ domain_name }}"
        ntp_servers:
          - "{{ ntp_server }}"
        search_domains:
          - "{{ domain_name }}"
        dns_servers:
          - "{{ dns_server }}"
      resource_type: EdgeNode
      display_name: "{{ node_info.item.vmname }}"
    description: "{{ node_info.item.vmname }} is deployed in parallel"
    state: "{{ nsx_state }}"
  async: 1800
  poll: 0
  register: deploy_trigger_job

- name: "Set job ID fact for {{ node_info.item.vmname }}"
  ansible.builtin.set_fact:
    temp_triggered_node: "{{ node_info | combine({'deploy_job_id': deploy_trigger_job.ansible_job_id}) }}"

- name: "Add to triggered nodes list"
  ansible.builtin.set_fact:
    triggered_nodes: "{{ triggered_nodes | default([]) + [temp_triggered_node] }}"
