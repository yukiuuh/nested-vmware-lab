---
- name: Build nested deployment_v2 vCenter storage run ID for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.set_fact:
    deployment_v2_vcenter_prepare_storage_run_id: "{{ now(utc=true, fmt='%Y%m%dT%H%M%S%fZ') }}"

- name: Build nested deployment_v2 vCenter storage facts for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.set_fact:
    deployment_v2_vcenter_prepare_current: "{{ deployment_v2_vcenter_item.value }}"
    deployment_v2_vcenter_prepare_storage_mode: >-
      {{ deployment_v2_vcenter_item.value.target.storage.mode | default('existing_datastore') }}
    deployment_v2_vcenter_prepare_datastore_min_free_mb: >-
      {{ (deployment_v2_vcenter_prepare_datastore_min_free_gb | int) * 1024 }}
    deployment_v2_vcenter_prepare_esxi_ssh_common_args: >-
      -F /dev/null
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ProxyCommand="ssh -F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -W %h:%p {{ hostvars[inventory_hostname].ansible_user }}@{{ hostvars[inventory_hostname].ansible_host }}"

- name: Validate nested deployment_v2 vCenter storage metadata for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.assert:
    that:
      - deployment_v2_vcenter_prepare_current.target.kind == "esxi"
      - deployment_v2_vcenter_prepare_current.target.esxi_host is defined
      - deployment_v2_vcenter_prepare_current.target.esxi_host.vm_name | default('', true) | length > 0
      - deployment_v2_vcenter_prepare_current.target.datastore | default('', true) | length > 0
      - deployment_v2_vcenter_prepare_storage_mode in ['existing_datastore', 'iscsi_datastore', 'vsan_bootstrap']
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.esxi_group | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.esxi_host.fqdn | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.storage.iscsi.storage | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.storage.iscsi.lun | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.storage.iscsi.lun_id is defined
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.storage.iscsi.portals | default([], true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'iscsi_datastore'
        or deployment_v2_vcenter_prepare_current.target.storage.iscsi.vmkernel_adapters | default([], true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'vsan_bootstrap'
        or deployment_v2_vcenter_prepare_current.target.storage.vsan.datastore_name | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'vsan_bootstrap'
        or deployment_v2_vcenter_prepare_current.target.storage.vsan.datacenter | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'vsan_bootstrap'
        or deployment_v2_vcenter_prepare_current.target.storage.vsan.cluster | default('', true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'vsan_bootstrap'
        or deployment_v2_vcenter_prepare_current.target.storage.vsan.cache_disks | default([], true) | length > 0
      - >-
        deployment_v2_vcenter_prepare_storage_mode != 'vsan_bootstrap'
        or deployment_v2_vcenter_prepare_current.target.storage.vsan.capacity_disks | default([], true) | length > 0
    fail_msg: >-
      nested_vsphere vCenter storage metadata is incomplete for {{ deployment_v2_vcenter_item.key }}.
      mode={{ deployment_v2_vcenter_prepare_storage_mode }}

- name: Build existing datastore verification script for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.set_fact:
    deployment_v2_vcenter_prepare_storage_script: |
      set -eu
      DATASTORE={{ deployment_v2_vcenter_prepare_current.target.datastore | quote }}
      MIN_FREE_MB={{ deployment_v2_vcenter_prepare_datastore_min_free_mb | int }}
      if ! esxcli storage filesystem list | awk -v ds="$DATASTORE" '$1 == ds { found=1 } END { exit !found }'; then
        echo "datastore $DATASTORE is not visible on this ESXi host" >&2
        exit 1
      fi
      if [ "$MIN_FREE_MB" -gt 0 ]; then
        FREE_MB="$(df -m "/vmfs/volumes/$DATASTORE" | awk 'NR == 2 { print $4 }')"
        if [ -n "$FREE_MB" ] && [ "$FREE_MB" -lt "$MIN_FREE_MB" ]; then
          echo "datastore $DATASTORE has ${FREE_MB}MB free; need at least ${MIN_FREE_MB}MB" >&2
          exit 1
        fi
      fi
  when: deployment_v2_vcenter_prepare_storage_mode == "existing_datastore"

- name: Verify existing datastore for {{ deployment_v2_vcenter_item.key }}
  community.vmware.vmware_vm_shell:
    hostname: "{{ deployment_v2.credentials.vsphere.server }}"
    username: "{{ deployment_v2.credentials.vsphere.user }}"
    password: "{{ deployment_v2.credentials.vsphere.password }}"
    validate_certs: false
    datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
    vm_id: "{{ deployment_v2_vcenter_prepare_current.target.esxi_host.vm_name }}"
    vm_username: root
    vm_password: "{{ deployment_v2.credentials.vm_admin_password }}"
    vm_shell: /bin/sh
    vm_shell_args: "-c {{ deployment_v2_vcenter_prepare_storage_script | quote }}"
    wait_for_process: true
  register: deployment_v2_vcenter_prepare_storage_verify
  changed_when: false
  failed_when: (deployment_v2_vcenter_prepare_storage_verify.exit_code | default(1)) != 0
  delegate_to: localhost
  become: false
  when: deployment_v2_vcenter_prepare_storage_mode == "existing_datastore"

- name: Build iSCSI target host set for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.set_fact:
    deployment_v2_vcenter_prepare_iscsi_hosts: >-
      {{
        deployment_v2.esxi_groups[
          deployment_v2_vcenter_prepare_current.target.esxi_group
        ].hosts | default([])
      }}
    deployment_v2_vcenter_prepare_iscsi_format_hosts: >-
      {{
        (
          deployment_v2.esxi_groups[
            deployment_v2_vcenter_prepare_current.target.esxi_group
          ].hosts | default([])
        )
        | selectattr('fqdn', 'equalto', deployment_v2_vcenter_prepare_current.target.esxi_host.fqdn)
        | list
      }}
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Validate iSCSI target host set for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.assert:
    that:
      - deployment_v2_vcenter_prepare_iscsi_hosts | length > 0
      - deployment_v2_vcenter_prepare_iscsi_format_hosts | length == 1
      - >-
        (
          deployment_v2_vcenter_prepare_iscsi_hosts
          | selectattr('vmkernel_adapters', 'defined')
          | selectattr('vmkernel_adapters')
          | list
          | length
        ) == (deployment_v2_vcenter_prepare_iscsi_hosts | length)
    fail_msg: >-
      iSCSI storage preparation requires every host in placement ESXi group
      {{ deployment_v2_vcenter_prepare_current.target.esxi_group }} to have
      rendered vmkernel_adapters, and exactly one format host matching
      {{ deployment_v2_vcenter_prepare_current.target.esxi_host.fqdn }}.
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Check sshpass is available for ESXi SSH storage preparation
  ansible.builtin.command:
    argv:
      - sshpass
      - -V
  register: deployment_v2_vcenter_prepare_sshpass_check
  changed_when: false
  delegate_to: localhost
  become: false
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Configure iSCSI discovery on every ESXi host for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.include_tasks: prepare_iscsi_host.yaml
  vars:
    deployment_v2_vcenter_prepare_iscsi_host: "{{ deployment_v2_vcenter_prepare_iscsi_host_item }}"
    deployment_v2_vcenter_prepare_iscsi_mode: configure
  loop: "{{ deployment_v2_vcenter_prepare_iscsi_hosts }}"
  loop_control:
    loop_var: deployment_v2_vcenter_prepare_iscsi_host_item
    label: "{{ deployment_v2_vcenter_prepare_iscsi_host_item.fqdn }}"
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Create or verify VMFS datastore on selected placement ESXi host for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.include_tasks: prepare_iscsi_host.yaml
  vars:
    deployment_v2_vcenter_prepare_iscsi_host: "{{ deployment_v2_vcenter_prepare_iscsi_host_item }}"
    deployment_v2_vcenter_prepare_iscsi_mode: format
  loop: "{{ deployment_v2_vcenter_prepare_iscsi_format_hosts }}"
  loop_control:
    loop_var: deployment_v2_vcenter_prepare_iscsi_host_item
    label: "{{ deployment_v2_vcenter_prepare_iscsi_host_item.fqdn }}"
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Verify VMFS datastore visibility on every ESXi host for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.include_tasks: prepare_iscsi_host.yaml
  vars:
    deployment_v2_vcenter_prepare_iscsi_host: "{{ deployment_v2_vcenter_prepare_iscsi_host_item }}"
    deployment_v2_vcenter_prepare_iscsi_mode: verify
  loop: "{{ deployment_v2_vcenter_prepare_iscsi_hosts }}"
  loop_control:
    loop_var: deployment_v2_vcenter_prepare_iscsi_host_item
    label: "{{ deployment_v2_vcenter_prepare_iscsi_host_item.fqdn }}"
  when: deployment_v2_vcenter_prepare_storage_mode == "iscsi_datastore"

- name: Build vSAN bootstrap preflight script for {{ deployment_v2_vcenter_item.key }}
  ansible.builtin.set_fact:
    deployment_v2_vcenter_prepare_storage_script: |
      set -eu
      DATASTORE={{ deployment_v2_vcenter_prepare_current.target.storage.vsan.datastore_name | quote }}
      CACHE_DISKS={{ deployment_v2_vcenter_prepare_current.target.storage.vsan.cache_disks | join(' ') | quote }}
      CAPACITY_DISKS={{ deployment_v2_vcenter_prepare_current.target.storage.vsan.capacity_disks | join(' ') | quote }}
      if esxcli storage filesystem list | awk -v ds="$DATASTORE" '$1 == ds { found=1 } END { exit !found }'; then
        exit 0
      fi
      for DISK in $CACHE_DISKS $CAPACITY_DISKS; do
        if [ ! -e "/vmfs/devices/disks/$DISK" ]; then
          echo "vSAN bootstrap disk $DISK is not visible on this ESXi host" >&2
          exit 1
        fi
        if esxcli storage vmfs extent list | awk 'NR > 2 { print $(NF-1) }' | grep -qx "$DISK"; then
          echo "vSAN bootstrap disk $DISK is already claimed by a VMFS datastore" >&2
          exit 1
        fi
      done
  when: deployment_v2_vcenter_prepare_storage_mode == "vsan_bootstrap"

- name: Preflight vSAN bootstrap disks for {{ deployment_v2_vcenter_item.key }}
  community.vmware.vmware_vm_shell:
    hostname: "{{ deployment_v2.credentials.vsphere.server }}"
    username: "{{ deployment_v2.credentials.vsphere.user }}"
    password: "{{ deployment_v2.credentials.vsphere.password }}"
    validate_certs: false
    datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
    vm_id: "{{ deployment_v2_vcenter_prepare_current.target.esxi_host.vm_name }}"
    vm_username: root
    vm_password: "{{ deployment_v2.credentials.vm_admin_password }}"
    vm_shell: /bin/sh
    vm_shell_args: "-c {{ deployment_v2_vcenter_prepare_storage_script | quote }}"
    wait_for_process: true
  register: deployment_v2_vcenter_prepare_vsan_preflight
  changed_when: false
  failed_when: (deployment_v2_vcenter_prepare_vsan_preflight.exit_code | default(1)) != 0
  delegate_to: localhost
  become: false
  when: deployment_v2_vcenter_prepare_storage_mode == "vsan_bootstrap"
