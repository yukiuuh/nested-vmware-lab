---
- name: Prepare deployment_v2 Router vCenter media and launch provider-target vCenters
  hosts: deployment_v2_routers
  become: true
  gather_facts: true
  strategy: free # noqa: run-once[play]
  vars:
    ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_runtime
      deployment_v2_router_runtime_prepare_phase: vcenter_media
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: provider_launch

- name: Prepare deployment_v2 ESXi bootstrap runtime and start ESXi bootstrap
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  strategy: free # noqa: run-once[play]
  vars:
    ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    deployment_v2_esxi_group_items: >-
      {{
        (deployment_v2.esxi_groups | default({}))
        | dict2items
        | selectattr('value.router', 'equalto', deployment_v2_router_name)
        | list
      }}
  roles:
    - role: deployment_v2_prepare_runtime
      deployment_v2_router_runtime_prepare_phase: esxi_bootstrap
  tasks:
    - name: Validate ESXi bootstrap capabilities
      ansible.builtin.assert:
        that:
          - item.value.install.method in ["ansible_router_pxe", "ansible_vsphere_iso_boot"]
          - >-
            item.value.install.method != "ansible_router_pxe"
            or (
              item.value.capabilities.power_control
              | default('vsphere_api' if (item.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
            ) != "none"
          - >-
            item.value.install.method != "ansible_vsphere_iso_boot"
            or (
              item.value.capabilities.boot_control
              | default('vsphere_api' if (item.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
            ) == "vsphere_api"
          - >-
            item.value.install.method != "ansible_vsphere_iso_boot"
            or (
              item.value.capabilities.console_input
              | default('vmware_sendkey' if (item.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
            ) == "vmware_sendkey"
        fail_msg: >-
          Unsupported ESXi bootstrap capabilities for {{ item.key }}. This slice
          supports ansible_router_pxe only when a power_control adapter is
          declared, and ansible_vsphere_iso_boot only with
          boot_control=vsphere_api plus console_input=vmware_sendkey.
      loop: "{{ deployment_v2_esxi_group_items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Validate vSphere credentials are available for vSphere-backed ESXi bootstrap
      ansible.builtin.assert:
        that:
          - deployment_v2.credentials is defined
          - deployment_v2.credentials.vsphere is defined
          - deployment_v2.credentials.vsphere.server is defined
          - deployment_v2.credentials.vsphere.user is defined
          - deployment_v2.credentials.vsphere.password is defined
          - deployment_v2.credentials.vsphere.datacenter is defined
        fail_msg: >-
          deployment_v2.credentials.vsphere must be present in ansible_inventory_seed to
          run vSphere-backed ESXi bootstrap operations
      loop: "{{ deployment_v2_esxi_group_items }}"
      loop_control:
        label: "{{ item.key }}"
      when: >-
        (
          item.value.install.method == "ansible_router_pxe"
          and (
            item.value.capabilities.power_control
            | default('vsphere_api' if (item.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
          ) == "vsphere_api"
        )
        or (
          item.value.install.method == "ansible_vsphere_iso_boot"
          and (
            item.value.capabilities.boot_control
            | default('vsphere_api' if (item.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
          ) == "vsphere_api"
        )

    - name: Check whether ESXi management API is already reachable
      ansible.builtin.wait_for:
        host: "{{ item.1.ansible.host }}"
        port: 443
        timeout: 5
        connect_timeout: 2
        sleep: 1
        state: started
      loop: "{{ query('subelements', deployment_v2_esxi_group_items, 'value.hosts', {'skip_missing': true}) }}"
      loop_control:
        label: "{{ item.1.fqdn }}"
      register: deployment_v2_esxi_api_checks
      changed_when: false
      ignore_errors: true

    - name: Reset ESXi VM when management API is not yet reachable
      vmware.vmware.vm_powerstate:
        hostname: "{{ deployment_v2.credentials.vsphere.server }}"
        username: "{{ deployment_v2.credentials.vsphere.user }}"
        password: "{{ deployment_v2.credentials.vsphere.password }}"
        validate_certs: false
        datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
        name: "{{ item.item.1.name }}"
        state: restarted
        force: true
      loop: "{{ deployment_v2_esxi_api_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.1.fqdn }}"
      when:
        - item.failed | default(false)
        - item.item.0.value.install.method == "ansible_router_pxe"
        - >-
          (
            item.item.0.value.capabilities.power_control
            | default('vsphere_api' if (item.item.0.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
          ) == "vsphere_api"
      delegate_to: localhost
      become: false

    - name: Bootstrap datastore_iso ESXi VMs that are not yet reachable
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_datastore_iso_bootstrap.yaml
      vars:
        deployment_v2_datastore_iso_vm_name: "{{ item.item.1.name }}"
        deployment_v2_datastore_iso_boot_kernel_options: "{{ item.item.1.pxe.boot_kernel_options }}"
      loop_control:
        label: "{{ item.item.1.fqdn }}"
      loop: "{{ deployment_v2_esxi_api_checks.results | default([]) }}"
      when:
        - item.failed | default(false)
        - item.item.0.value.install.method == "ansible_vsphere_iso_boot"
        - >-
          (
            item.item.0.value.capabilities.boot_control
            | default('vsphere_api' if (item.item.0.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
          ) == "vsphere_api"
        - >-
          (
            item.item.0.value.capabilities.console_input
            | default('vmware_sendkey' if (item.item.0.value.placement.kind | default('')) == 'provider_vsphere' else 'none')
          ) == "vmware_sendkey"

- name: Verify nested-vCenter target deployment_v2 ESXi bootstrap completed
  hosts: deployment_v2_esxi
  gather_facts: false
  strategy: free # noqa: run-once[play]
  vars:
    deployment_v2_verification_router: "{{ deployment_v2_esxi_group_config.router }}"
    deployment_v2_nested_vcenter_target_esxi_hosts: >-
      {{
        (deployment_v2.vcenters | default({}))
        | dict2items
        | selectattr('value.placement.kind', 'equalto', 'nested_vsphere')
        | selectattr('value.target.esxi_host.fqdn', 'defined')
        | map(attribute='value.target.esxi_host.fqdn')
        | unique
        | list
      }}
  tasks:
    - name: Verify ESXi host required by nested vCenter placement
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_verify_host.yaml
      when: deployment_v2_esxi_host.fqdn in deployment_v2_nested_vcenter_target_esxi_hosts

- name: Launch nested-ESXi-target deployment_v2 vCenters from Router-mounted installers
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  strategy: free # noqa: run-once[play]
  vars:
    ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: nested_launch

- name: Verify remaining deployment_v2 ESXi bootstrap completed
  hosts: deployment_v2_esxi
  gather_facts: false
  strategy: free # noqa: run-once[play]
  vars:
    deployment_v2_verification_router: "{{ deployment_v2_esxi_group_config.router }}"
    deployment_v2_nested_vcenter_target_esxi_hosts: >-
      {{
        (deployment_v2.vcenters | default({}))
        | dict2items
        | selectattr('value.placement.kind', 'equalto', 'nested_vsphere')
        | selectattr('value.target.esxi_host.fqdn', 'defined')
        | map(attribute='value.target.esxi_host.fqdn')
        | unique
        | list
      }}
  tasks:
    - name: Verify ESXi host not already required by nested vCenter placement
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_verify_host.yaml
      when: deployment_v2_esxi_host.fqdn not in deployment_v2_nested_vcenter_target_esxi_hosts

- name: Wait for deployment_v2 vCenter deployments and register ESXi hosts
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  strategy: free # noqa: run-once[play]
  vars:
    ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: wait
    - role: deployment_v2_register_esxi
