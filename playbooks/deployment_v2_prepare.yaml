---
- name: Prepare deployment_v2 Routers
  hosts: deployment_v2_routers
  become: true
  gather_facts: true
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_runtime

- name: Launch provider-target deployment_v2 vCenters from Router-mounted installers
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: provider_launch

- name: Ensure deployment_v2 ESXi bootstrap is progressing
  hosts: deployment_v2_routers
  gather_facts: false
  vars:
    deployment_v2_esxi_group_items: >-
      {{
        (deployment_v2.esxi_groups | default({}))
        | dict2items
        | selectattr('value.router', 'equalto', deployment_v2_router_name)
        | list
      }}
  tasks:
    - name: Validate vSphere credentials are available for ESXi reset
      ansible.builtin.assert:
        that:
          - deployment_v2.credentials is defined
          - deployment_v2.credentials.vsphere is defined
          - deployment_v2.credentials.vsphere.server is defined
          - deployment_v2.credentials.vsphere.user is defined
          - deployment_v2.credentials.vsphere.password is defined
          - deployment_v2.credentials.vsphere.datacenter is defined
        fail_msg: >-
          deployment_v2.credentials.vsphere must be present in ansible_inventory_seed to
          reset ESXi VMs automatically
      when: deployment_v2_esxi_group_items | length > 0

    - name: Check whether ESXi management API is already reachable
      ansible.builtin.wait_for:
        host: "{{ item.1.ansible.host }}"
        port: 443
        timeout: 5
        connect_timeout: 2
        sleep: 1
        state: started
      loop: "{{ query('subelements', deployment_v2_esxi_group_items, 'value.hosts', {'skip_missing': true}) }}"
      loop_control:
        label: "{{ item.1.fqdn }}"
      register: deployment_v2_esxi_api_checks
      changed_when: false
      ignore_errors: true

    - name: Reset ESXi VM when management API is not yet reachable
      vmware.vmware.vm_powerstate:
        hostname: "{{ deployment_v2.credentials.vsphere.server }}"
        username: "{{ deployment_v2.credentials.vsphere.user }}"
        password: "{{ deployment_v2.credentials.vsphere.password }}"
        validate_certs: false
        datacenter: "{{ deployment_v2.credentials.vsphere.datacenter }}"
        name: "{{ item.item.1.name }}"
        state: restarted
        force: true
      loop: "{{ deployment_v2_esxi_api_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.1.fqdn }}"
      when:
        - item.failed | default(false)
        - item.item.0.value.install.method == "ansible_router_pxe"
      delegate_to: localhost

    - name: Bootstrap datastore_iso ESXi VMs that are not yet reachable
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_datastore_iso_bootstrap.yaml
      vars:
        deployment_v2_datastore_iso_vm_name: "{{ item.item.1.name }}"
        deployment_v2_datastore_iso_boot_kernel_options: "{{ item.item.1.pxe.boot_kernel_options }}"
      loop_control:
        label: "{{ item.item.1.fqdn }}"
      loop: "{{ deployment_v2_esxi_api_checks.results | default([]) }}"
      when:
        - item.failed | default(false)
        - item.item.0.value.install.method == "ansible_vsphere_iso_boot"

- name: Verify nested-vCenter target deployment_v2 ESXi bootstrap completed
  hosts: deployment_v2_esxi
  gather_facts: false
  vars:
    deployment_v2_verification_router: "{{ deployment_v2_esxi_group_config.router }}"
    deployment_v2_nested_vcenter_target_esxi_groups: >-
      {{
        (deployment_v2.vcenters | default({}))
        | dict2items
        | selectattr('value.placement.kind', 'equalto', 'nested_vsphere')
        | map(attribute='value.placement.esxi_group')
        | unique
        | list
      }}
  tasks:
    - name: Verify ESXi host required by nested vCenter placement
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_verify_host.yaml
      when: deployment_v2_esxi_group_name in deployment_v2_nested_vcenter_target_esxi_groups

- name: Launch nested-ESXi-target deployment_v2 vCenters from Router-mounted installers
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: nested_launch

- name: Verify remaining deployment_v2 ESXi bootstrap completed
  hosts: deployment_v2_esxi
  gather_facts: false
  vars:
    deployment_v2_verification_router: "{{ deployment_v2_esxi_group_config.router }}"
    deployment_v2_nested_vcenter_target_esxi_groups: >-
      {{
        (deployment_v2.vcenters | default({}))
        | dict2items
        | selectattr('value.placement.kind', 'equalto', 'nested_vsphere')
        | map(attribute='value.placement.esxi_group')
        | unique
        | list
      }}
  tasks:
    - name: Verify ESXi host not already required by nested vCenter placement
      ansible.builtin.include_tasks: tasks/deployment_v2_esxi_verify_host.yaml
      when: deployment_v2_esxi_group_name not in deployment_v2_nested_vcenter_target_esxi_groups

- name: Wait for deployment_v2 vCenter deployments
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_prepare_vcenter
      deployment_v2_vcenter_prepare_phase: wait

- name: Register deployment_v2 ESXi hosts into deployed vCenters
  hosts: deployment_v2_routers
  become: true
  gather_facts: false
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  roles:
    - role: deployment_v2_register_esxi
